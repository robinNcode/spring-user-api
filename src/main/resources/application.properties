spring.application.name=user-api

# MySQL database configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:user_api}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Keep H2 console disabled for MySQL usage
spring.h2.console.enabled=false

server.port=6062

# JWT configuration
jwt.secret=MyVeryStrongJwtSecretKeyForUserApiApplication1234567890
jwt.expiration=3600000
