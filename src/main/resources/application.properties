spring.application.name=user-api

# MySQL database configuration - target database
spring.datasource.url=jdbc:mysql://localhost:3306/user_api?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=userapi
spring.datasource.password=StrongPassword123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Keep H2 console disabled for MySQL usage
spring.h2.console.enabled=false

server.port=6062

# JWT configuration
jwt.secret=MyVeryStrongJwtSecretKeyForUserApiApplication1234567890
jwt.expiration=3600000
