spring.application.name=user-api

# Database configuration (in-memory H2 for local development)
spring.datasource.url=jdbc:h2:mem:userdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8085

# JWT configuration
jwt.secret=MyVeryStrongJwtSecretKeyForUserApiApplication1234567890
jwt.expiration=3600000
